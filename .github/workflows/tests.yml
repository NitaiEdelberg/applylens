# Everything here runs WITHOUT a Groq key: the unit tests stub the LLM, and the
# coverage eval is deterministic by construction. So a pull request gets a real
# verdict in about a minute and costs nothing in API calls. The evals that do
# need the model (grounding, fabrication precision/recall) are run locally and
# committed as a report, because a CI job that needs a paid key on every push
# is a job that gets disabled within a week.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements.txt pytest
      - name: Unit tests
        run: cd backend && python -m pytest -q
      - name: Coverage-signal eval (fails on a precision/recall regression)
        run: python evals/run_skillmatch_eval.py --verbose

      - name: Retrieval eval (deterministic TF-IDF path, no key needed)
        run: python evals/run_retrieval_eval.py --verbose

      - name: Grounding evals, replayed from the recorded tape
        run: |
          if [ -f evals/cassettes/grounding.jsonl ]; then
            python evals/run_evals.py --replay --verbose
          else
            echo "No tape recorded yet. Record one with:"
            echo "  GROQ_API_KEY=... python evals/run_evals.py --record"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend
      - name: Build
        run: npm run build --prefix frontend
