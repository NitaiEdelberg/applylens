# Everything here runs WITHOUT a Groq key: the unit tests stub the LLM, and the
# coverage eval is deterministic by construction. So a pull request gets a real
# verdict in about a minute and costs nothing in API calls. The evals that do
# need the model (grounding, fabrication precision/recall) are run locally and
# committed as a report, because a CI job that needs a paid key on every push
# is a job that gets disabled within a week.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements.txt pytest
      # A red CI you cannot read is a red CI you learn to ignore. Logs and the
      # job summary both need a login; annotations do not (public check-runs
      # annotations API), so the failing tests are also emitted as one.
      - name: Unit tests
        run: |
          cd backend
          set +e
          python -m pytest -q --tb=short 2>&1 | tee /tmp/pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E "^(FAILED|ERROR)|Error|assert" /tmp/pytest.log | head -12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest failed::${msg}"
            {
              echo '### pytest failed'
              echo '```'
              tail -60 /tmp/pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Coverage-signal eval (fails on a precision/recall regression)
        run: python evals/run_skillmatch_eval.py --verbose

      - name: Retrieval eval (deterministic TF-IDF path, no key needed)
        run: python evals/run_retrieval_eval.py --verbose

      - name: Grounding evals, replayed from the recorded tape
        run: |
          if [ -f evals/cassettes/grounding.jsonl ]; then
            python evals/run_evals.py --replay --verbose
          else
            echo "No tape recorded yet. Record one with:"
            echo "  GROQ_API_KEY=... python evals/run_evals.py --record"
          fi

      # The badge and the Evals tab are generated from the reports above. If a
      # report changes and the numbers the app shows do not, fail: the badge
      # once said "100%" from a stale file while the eval said 97.9%.
      - name: UI numbers match the eval reports
        run: python evals/build_dashboard.py --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend
      - name: Build
        run: npm run build --prefix frontend
